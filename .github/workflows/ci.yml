# CI + CD for the Folio mobile app (Expo).
#
# Pull requests to master:
#   version-bump  → bumps package.json / package-lock.json / app.json (expo.version)
#                   from the highest released tag and the PR labels (version:major |
#                   version:minor | version:patch, default patch; version:none opts
#                   out), and pushes the commit back to the PR branch. This keeps the
#                   manifests roughly right; it does not decide the release.
#   lint, type-check (parallel) → test.
#
# Push to master (a squash-merged PR):
#   release → computes the next version from the TAG LIST, tags the merge commit and
#             publishes a GitHub Release with generated notes. Reading the version from
#             package.json instead used to let two pull requests open at once claim the
#             same number: the second to merge hit an existing tag and was silently
#             skipped while the run stayed green. Only version:none opts out now.
#
# App binaries are not built here: EAS builds / dev clients are cut separately.

name: CI

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  statuses: write

env:
  NODE_VERSION: 22

jobs:
  # Job 1: compute and commit the version bump (PR only)
  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    outputs:
      new_version: ${{ steps.compute-version.outputs.new_version }}
      version_bumped: ${{ steps.compute-version.outputs.version_bumped }}
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get bump type from PR labels
        id: get-labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          echo "Labels from event: $EVENT_LABELS"

          LABELS="$EVENT_LABELS"
          if [ "$LABELS" = "[]" ] || [ -z "$LABELS" ]; then
            LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name' 2>&1) || true
            echo "Labels from gh CLI: $LABELS"
          fi

          # Explicit label wins; otherwise default to patch so every merged PR
          # produces a release. `version:none` opts out (docs-only, ci-only).
          if echo "$LABELS" | grep -q "version:major"; then
            echo "bump_type=major" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "version:minor"; then
            echo "bump_type=minor" >> "$GITHUB_OUTPUT"
          elif echo "$LABELS" | grep -q "version:none"; then
            echo "bump_type=none" >> "$GITHUB_OUTPUT"
          else
            echo "bump_type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Get master version
        id: main-version
        run: |
          # The highest released tag, matching what the release job computes at merge.
          # Reading master's package.json instead let two open pull requests claim the
          # same number.
          MAIN_VERSION=$(git tag -l 'v[0-9]*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          MAIN_VERSION=${MAIN_VERSION:-0.0.0}
          echo "main_version=$MAIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "master version: $MAIN_VERSION"

      - name: Compute new version
        id: compute-version
        run: |
          BUMP_TYPE="${{ steps.get-labels.outputs.bump_type }}"
          MAIN_VERSION="${{ steps.main-version.outputs.main_version }}"
          PR_VERSION=$(node -pe 'require("./package.json").version')
          echo "PR version: $PR_VERSION / master version: $MAIN_VERSION / bump: $BUMP_TYPE"

          if [ "$BUMP_TYPE" = "none" ]; then
            echo "new_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
            echo "version:none — skipping bump"
            exit 0
          fi

          # PR version already ahead of master → bumped by hand or by an earlier run.
          version_gt() {
            test "$(printf '%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" && test "$1" != "$2"
          }
          if version_gt "$PR_VERSION" "$MAIN_VERSION"; then
            echo "new_version=$PR_VERSION" >> "$GITHUB_OUTPUT"
            echo "version_bumped=false" >> "$GITHUB_OUTPUT"
            echo "PR version $PR_VERSION > master $MAIN_VERSION — already bumped, skipping"
            exit 0
          fi

          if ! echo "$MAIN_VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Invalid master version format: $MAIN_VERSION"
            exit 1
          fi

          MAJOR=$(echo "$MAIN_VERSION" | cut -d. -f1)
          MINOR=$(echo "$MAIN_VERSION" | cut -d. -f2)
          PATCH=$(echo "$MAIN_VERSION" | cut -d. -f3)
          case "$BUMP_TYPE" in
            major) NEW_VERSION="$((MAJOR + 1)).0.0" ;;
            minor) NEW_VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_bumped=true" >> "$GITHUB_OUTPUT"
          echo "Version will bump: $PR_VERSION -> $NEW_VERSION ($BUMP_TYPE on master $MAIN_VERSION)"

      - name: Setup Node.js
        if: steps.compute-version.outputs.version_bumped == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Update package.json, package-lock.json and app.json
        if: steps.compute-version.outputs.version_bumped == 'true'
        env:
          NEW_VERSION: ${{ steps.compute-version.outputs.new_version }}
        run: |
          npm version "$NEW_VERSION" --no-git-tag-version
          # Keep the Expo app version (shown in the stores / Settings) in sync.
          node -e '
            const fs = require("fs");
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.version = process.env.NEW_VERSION;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2) + "\n");
          '

      - name: Commit version bump to PR
        if: steps.compute-version.outputs.version_bumped == 'true'
        run: |
          NEW_VERSION="${{ steps.compute-version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet package.json package-lock.json app.json; then
            git add package.json package-lock.json app.json
            git commit -m "chore: bump version to $NEW_VERSION"
            git push origin "${{ github.head_ref }}"
          else
            echo "Files already at version $NEW_VERSION"
          fi

  # Job 2: lint (parallel with type-check)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-bump]
    if: always() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes (post-bump commit)
        if: github.event_name == 'pull_request'
        run: git pull origin "${{ github.head_ref }}" || true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run lint

  # Job 3: type-check (parallel with lint)
  type-check:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [version-bump]
    if: always() && (needs.version-bump.result == 'success' || needs.version-bump.result == 'skipped')
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes (post-bump commit)
        if: github.event_name == 'pull_request'
        run: git pull origin "${{ github.head_ref }}" || true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run type-check

  # Job 4: jest (after lint + type-check)
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check]
    # Explicit result checks: the default success() also inspects transitive
    # ancestors, and version-bump is skipped on pushes to master.
    if: always() && needs.lint.result == 'success' && needs.type-check.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Pull latest changes (post-bump commit)
        if: github.event_name == 'pull_request'
        run: git pull origin "${{ github.head_ref }}" || true

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm test -- --ci

      # A push made with GITHUB_TOKEN (the bump commit) never triggers a new
      # workflow run, so branch protection would wait forever for checks on the
      # PR HEAD. Forward this job's outcome as a commit status on that SHA.
      - name: Forward check status to PR HEAD
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          EVENT_SHA="${{ github.event.pull_request.head.sha }}"
          if [ "$HEAD_SHA" = "$EVENT_SHA" ]; then
            echo "HEAD unchanged after bump — nothing to forward."
            exit 0
          fi
          if [ "${{ job.status }}" = "success" ]; then STATE="success"; else STATE="failure"; fi
          echo "Forwarding status '$STATE' to post-bump SHA $HEAD_SHA"
          gh api -X POST -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/statuses/$HEAD_SHA" \
            -f state="$STATE" \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="test (forwarded from ${EVENT_SHA:0:7})" \
            -f context="test"

  # Job 5: release — tag + GitHub Release (push to master only)
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve the bump type from the merged pull request
        id: bump-type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABELS=$(gh api "repos/${{ github.repository }}/commits/$GITHUB_SHA/pulls" \
            --jq '.[].labels[].name' 2>/dev/null || echo "")
          echo "Labels on the merged PR: ${LABELS:-<none>}"

          # Explicit label wins; otherwise patch, so every merged PR releases.
          # `version:none` opts out — docs-only, ci-only, or a hotfix riding on
          # the previous release.
          if echo "$LABELS" | grep -q "version:none"; then
            TYPE=none
          elif echo "$LABELS" | grep -q "version:major"; then
            TYPE=major
          elif echo "$LABELS" | grep -q "version:minor"; then
            TYPE=minor
          else
            TYPE=patch
          fi
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"
          echo "Bump type: $TYPE"

      - name: Compute the next version from the tag list
        id: get-version
        if: steps.bump-type.outputs.type != 'none'
        run: |
          # The highest released tag, not package.json. The manifest is bumped on the
          # pull request from whatever master read at that moment, so two pull requests
          # open at once claimed the same number: the second to merge landed on a tag
          # that already existed and the release was silently skipped while the run
          # stayed green. The tag list says what has actually shipped, and it is only
          # read here, after the merge.
          BASE=$(git tag -l 'v[0-9]*' | sed 's/^v//' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          BASE=${BASE:-0.0.0}

          MAJOR=${BASE%%.*}; REST=${BASE#*.}; MINOR=${REST%%.*}; PATCH=${REST#*.}
          case "${{ steps.bump-type.outputs.type }}" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
            patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
          esac

          echo "Highest released tag: v$BASE -> releasing v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

          # The manifests no longer decide the release, but they still drive the Expo
          # build, so a drift between them is worth surfacing.
          PKG=$(node -pe 'require("./package.json").version')
          APP=$(node -pe 'require("./app.json").expo.version')
          if [ "$PKG" != "$APP" ]; then
            echo "::warning::package.json ($PKG) and app.json expo.version ($APP) differ"
          fi

      - name: Create tag
        if: steps.bump-type.outputs.type != 'none'
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: steps.bump-type.outputs.type != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.get-version.outputs.tag }}"
          gh release create "$TAG" --title "$TAG" --generate-notes --latest

      - name: Job summary
        run: |
          if [ "${{ steps.bump-type.outputs.type }}" = "none" ]; then
            echo "## Release skipped — the merged pull request carried version:none" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Release ${{ steps.get-version.outputs.tag }} created" >> "$GITHUB_STEP_SUMMARY"
            echo "https://github.com/${{ github.repository }}/releases/tag/${{ steps.get-version.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          fi
